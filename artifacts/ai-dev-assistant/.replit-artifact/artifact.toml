kind = "web"
previewPath = "/"
title = "AI-Powered Developer Assistant"
version = "1.0.0"
id = "artifacts/ai-dev-assistant"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23185

[services.development]
run = "pnpm --filter @workspace/ai-dev-assistant run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-dev-assistant", "run", "build" ]
publicDir = "artifacts/ai-dev-assistant/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23185"
BASE_PATH = "/"
